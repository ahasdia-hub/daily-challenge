<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-db.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050919">
<title>The Daily Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap">
<style>
:root{
  /* Layout idea: a night-sky journey. Each date is a planet-station on a glowing trail that climbs from a launch pad; points float above each planet. */
  --bg-0:#050919;
  --bg-1:#0C1538;
  --line:rgba(150,170,255,.18);
  --ink:#F3F5FF;
  --ink-2:#A9B3DF;
  --gold:#FFC93C;
  --good:#34E29B;
  --bad:#FF5C7C;
  --late:#FFB547;
  --font-display:"Fredoka","Heebo","Cairo","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Heebo","Cairo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --kid:#FFC93C;--kid-l:#FFE3A0;--kid-d:#B8860B;--kid-glow:rgba(255,201,60,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg-0);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 700px at 85% -5%,rgba(124,92,255,.30),transparent 60%),
  radial-gradient(900px 650px at -10% 35%,rgba(30,190,255,.14),transparent 60%),
  radial-gradient(1000px 800px at 50% 115%,rgba(255,160,60,.13),transparent 60%),
  linear-gradient(180deg,#081030 0%,#050919 100%)}
#app{position:relative;z-index:1;min-height:100vh}
#modal{position:relative;z-index:60}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.i{width:20px;height:20px;flex:none;vertical-align:middle}
.flip{transform:scaleX(-1)}
.row{display:flex;align-items:center;flex-wrap:wrap}
.gap{gap:10px}
.end{justify-content:flex-end}
.tb-spacer{flex:1}

/* ---------- shared pieces ---------- */
.card{background:linear-gradient(180deg,rgba(28,40,98,.80),rgba(14,22,58,.86));border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pad{padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:18px;padding:13px 24px;border-radius:18px;transition:transform .08s ease,box-shadow .08s ease,filter .2s,background .2s;text-decoration:none;white-space:nowrap}
.btn.sm{font-size:15px;padding:9px 14px;border-radius:14px;gap:7px}
.btn.sm .i{width:17px;height:17px}
.btn.big{font-size:21px;padding:16px 34px;border-radius:20px}
.btn-gold{background:linear-gradient(180deg,#FFE07A 0%,#FFB51F 100%);color:#2B1700;box-shadow:0 6px 0 #C7770A,0 14px 30px rgba(255,170,30,.32)}
.btn-gold:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #C7770A,0 8px 18px rgba(255,170,30,.3)}
.btn-ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-danger{background:linear-gradient(180deg,#FF8AA2,#FF4D73);color:#2A0010;box-shadow:0 5px 0 #B3203F}
.btn.danger{color:#FF9DB1}
.btn:disabled{filter:grayscale(.85) brightness(.7)}
.icon-btn{width:44px;height:44px;border-radius:14px;display:inline-grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);flex:none;transition:background .2s,transform .1s}
.icon-btn:hover:not(:disabled){background:rgba(255,255,255,.13)}
.icon-btn:active:not(:disabled){transform:scale(.94)}
.icon-btn:disabled{opacity:.35}
.icon-btn.sm{width:36px;height:36px;border-radius:11px}
.icon-btn.sm .i{width:17px;height:17px}
.icon-btn.danger{color:#FF9DB1}
.link{color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip .i{width:16px;height:16px}
.chip.gold{color:var(--gold);border-color:rgba(255,201,60,.45)}
.chip.late{color:var(--late);border-color:rgba(255,181,71,.45)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chips.left{justify-content:flex-start}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.08);color:var(--ink-2);white-space:nowrap}
.pill .i{width:13px;height:13px}
.pill.ok{background:rgba(52,226,155,.15);color:var(--good)}
.pill.go{background:rgba(255,201,60,.15);color:var(--gold)}
.pill.late{background:rgba(255,181,71,.14);color:var(--late)}
.pill.bad{background:rgba(255,92,124,.15);color:#FF9DB1;white-space:normal}
.callout{display:flex;gap:10px;align-items:flex-start;text-align:start;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:15px}
.callout .i{margin-top:2px}
.callout.late{background:rgba(255,181,71,.1);border-color:rgba(255,181,71,.45);color:#FFE2B5}
.callout.go{background:rgba(255,201,60,.1);border-color:rgba(255,201,60,.4)}
.callout.bad{background:rgba(255,92,124,.1);border-color:rgba(255,92,124,.45);display:block;margin-bottom:16px}
.callout.bad ul{margin:6px 0 0;padding-left:20px}
.eyebrow{font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.orb{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;font-size:58px;line-height:1;flex:none;
  background:radial-gradient(circle at 32% 28%,var(--kid-l),var(--kid) 55%,var(--kid-d));
  box-shadow:0 0 0 6px rgba(255,255,255,.06),0 0 46px var(--kid-glow),inset -10px -14px 24px rgba(0,0,0,.3)}
.orb.md{width:64px;height:64px;font-size:34px;box-shadow:0 0 0 4px rgba(255,255,255,.06),0 0 26px var(--kid-glow),inset -6px -8px 14px rgba(0,0,0,.3)}
.orb.sm{width:52px;height:52px;font-size:28px;box-shadow:0 0 0 3px rgba(255,255,255,.06),0 0 20px var(--kid-glow),inset -5px -7px 12px rgba(0,0,0,.3)}
.orb.xs{width:36px;height:36px;font-size:20px;box-shadow:0 0 14px var(--kid-glow),inset -4px -5px 9px rgba(0,0,0,.3)}
.orb.has-photo{padding:3px;background:var(--kid);overflow:hidden}
.av-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;pointer-events:none;-webkit-user-select:none;user-select:none}
.orb.gold{--kid:#FFC93C;--kid-l:#FFE9A8;--kid-d:#B8730B;--kid-glow:rgba(255,201,60,.45);color:#2B1700}
.orb.gold .i{width:28px;height:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;z-index:90;padding:12px 18px;border-radius:16px;background:#1A2560;border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.45);font-weight:600;display:flex;align-items:center;gap:8px;transition:all .25s ease;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(52,226,155,.6)}
.toast.bad{border-color:rgba(255,92,124,.6)}
.toast .i{width:18px;height:18px}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:spin 1s linear infinite;flex:none}

/* ---------- home ---------- */
.horizon{position:fixed;left:50%;bottom:-118vmax;width:150vmax;height:150vmax;transform:translateX(-50%);border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 50% 0%,rgba(110,140,255,.38),rgba(20,30,80,.92) 18%,#070C26 42%);box-shadow:0 -20px 90px rgba(90,130,255,.35)}
.home{position:relative;max-width:980px;margin:0 auto;padding:44px 20px 60px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;animation:fadeUp .7s ease both}
.logo-the{font-family:var(--font-display);font-weight:500;font-size:17px;letter-spacing:.6em;text-transform:uppercase;color:var(--ink-2);margin-right:-.6em}
.logo-row{display:flex;align-items:center;gap:6px}
.logo-daily{font-family:var(--font-display);font-weight:700;font-size:clamp(64px,15vw,112px);line-height:.92;letter-spacing:-.01em;
  background:linear-gradient(180deg,#FFF4C9 0%,#FFC93C 48%,#FF8A00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 26px rgba(255,170,30,.35))}
.logo-planet{width:clamp(54px,12vw,84px);height:auto;animation:float 5s ease-in-out infinite}
.logo-challenge{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,6.4vw,46px);letter-spacing:.16em;text-transform:uppercase;margin-right:-.16em}
.tagline{font-family:var(--font-display);font-size:18px;color:var(--ink-2);margin-top:-12px}
.date-line{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
.who{font-family:var(--font-display);font-size:22px;font-weight:500;margin-top:6px}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;width:100%;max-width:740px}
.kid-card{position:relative;padding:26px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .25s ease,box-shadow .25s ease;animation:fadeUp .6s ease both}
.kid-card:nth-child(2){animation-delay:.08s}
.kid-card:hover{transform:translateY(-6px);box-shadow:0 26px 60px rgba(0,0,0,.45),0 0 0 2px var(--kid)}
.kid-card .orb{animation:float 4.5s ease-in-out infinite;margin-bottom:6px}
.kid-card:nth-child(2) .orb{animation-delay:-2s}
.kc-name{font-family:var(--font-display);font-weight:600;font-size:32px;line-height:1}
.kc-sub{color:var(--ink-2);font-size:15px}
.kc-stats{display:flex;gap:10px;margin-top:4px}
.kc-stats>span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-family:var(--font-display);font-weight:600;font-size:17px}
.kc-stats .i{width:18px;height:18px}
.kc-line{margin-top:6px;font-size:14px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.kc-line.go{color:var(--kid-l)}
.kc-line.ok{color:var(--good)}
.kc-line .i{width:16px;height:16px}
.kc-late{color:var(--late)}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--kid);box-shadow:0 0 0 0 var(--kid-glow);animation:glowPulse 1.6s infinite}
.parent-btn{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;border:1px dashed rgba(150,170,255,.3)}
.parent-btn:hover{color:var(--ink);border-color:rgba(150,170,255,.6)}
.parent-btn .i{width:16px;height:16px}
.note{display:flex;gap:14px;align-items:center;text-align:left;padding:18px 20px;max-width:520px}
.note .i{width:26px;height:26px;color:var(--gold)}
.setup{padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:left}

/* ---------- PIN pad & modals ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,6,20,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;overflow-y:auto}
.overlay.anim{animation:fadeIn .2s ease}
.overlay.anim .modal,.overlay.anim .pin{animation:popUp .3s cubic-bezier(.2,.9,.3,1.2) both}
.modal{position:relative;width:min(520px,100%);padding:26px 22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 36px);overflow-y:auto}
.modal.wide{width:min(760px,100%)}
.modal .close{position:absolute;top:14px;right:14px}
.modal h2{padding-inline-end:46px}
.home-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.board-btn{color:var(--gold);border-color:rgba(255,201,60,.4)}
.row.wrap{flex-wrap:wrap}
.board h2{display:flex;align-items:center;gap:10px}.board h2 .i{color:var(--gold)}
.bd-ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.seg-toggle{display:inline-flex;padding:4px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.seg-toggle button{padding:7px 16px;border-radius:9px;font-weight:600;color:var(--ink-2)}
.seg-toggle button.on{background:var(--gold);color:#1B1300}
.bd-nav{display:flex;align-items:center;gap:6px}.bd-label{font-weight:600;min-width:150px;text-align:center;font-size:14px}
.icon-btn.sm{width:34px;height:34px}.icon-btn[disabled]{opacity:.3;pointer-events:none}
.i.flip{transform:scaleX(-1)}
.bd-note{font-family:var(--font-display);font-size:18px;color:#FFE6A6;margin:0}
.bd-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.bd-row .orb{position:relative;flex:none}.crown{position:absolute;top:-16px;inset-inline-start:50%;transform:translateX(-50%) rotate(-10deg);font-size:22px}
.bd-main{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.bd-top{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.bd-pts{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--gold);display:inline-flex;align-items:center;gap:6px}
.bd-sec{font-weight:600;color:var(--ink-2);font-size:14px;margin-top:4px}
.bchart{width:100%;height:auto}
.bc-grid{stroke:rgba(255,255,255,.09)}.bc-today{stroke:rgba(255,201,60,.5);stroke-dasharray:4 4}
.bc-yl{fill:var(--ink-2);font-size:15px;text-anchor:end}.bc-xl{fill:var(--ink-2);font-size:15px;text-anchor:middle}
.legend.center{justify-content:center}
.bd-days{display:grid;grid-template-columns:auto repeat(7,1fr);gap:5px;align-items:center;font-size:13px}
.bd-dh{text-align:center;color:var(--ink-2);font-weight:600}.bd-dh.today{color:var(--gold)}
.bd-dn{font-weight:700;padding-inline-end:6px}
.bd-dv{text-align:center;padding:6px 0;border-radius:8px;background:rgba(255,255,255,.04);color:var(--ink-2)}
.bd-dv.on{background:color-mix(in srgb,var(--c) 22%,transparent);color:#fff;font-weight:700}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:6px}
.pin{position:relative;width:min(350px,100%);padding:26px 22px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pin .close{position:absolute;top:14px;right:14px}
.pin h2{font-size:28px;margin-top:6px}
.dots{display:flex;justify-content:center;gap:14px;margin:14px 0 4px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-2);transition:all .15s}
.dot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 14px rgba(255,200,60,.8);transform:scale(1.12)}
.pin.good .dot{background:var(--good);border-color:var(--good);box-shadow:0 0 14px rgba(52,226,155,.8)}
.pin-msg{min-height:22px;color:#FF9DB1;font-weight:600;font-size:14px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;width:100%;margin-top:4px}
.key{height:62px;border-radius:18px;font-family:var(--font-display);font-size:26px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid var(--line);display:grid;place-items:center;transition:transform .08s,background .15s}
.key:active{transform:scale(.93);background:rgba(255,255,255,.16)}
.key.ghost{background:transparent;font-size:18px;color:var(--ink-2)}
.shake,.pin.shake{animation:shake .45s ease}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px}
.av{height:62px;border-radius:16px;font-size:34px;background:rgba(255,255,255,.06);border:2px solid var(--line);transition:transform .1s}
.av:hover{transform:scale(1.06)}
.av.on{border-color:var(--gold);background:rgba(255,201,60,.14)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.rules li{display:flex;gap:14px;align-items:flex-start}
.r-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.r-ic.gold{color:var(--gold)}
.r-ic.late{color:var(--late)}

/* ---------- map ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(180deg,rgba(5,9,25,.94),rgba(5,9,25,.78));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-who{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:19px;padding:2px 8px 2px 2px;border-radius:999px}
.tb-who:hover{background:rgba(255,255,255,.06)}
.topbar .chip{font-family:var(--font-display);font-size:16px;padding:6px 12px}
.topbar .chip .i{width:17px;height:17px}
.pv-banner{position:sticky;top:65px;z-index:29;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:rgba(255,201,60,.14);border-bottom:1px solid rgba(255,201,60,.35);color:#FFE6A6;font-size:14px;font-weight:600;text-align:center}
.pv-banner .i{width:16px;height:16px}
.map-layout{max-width:1160px;margin:0 auto;padding:18px 16px 130px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:960px){.map-layout{grid-template-columns:330px minmax(0,1fr);align-items:start;padding-bottom:60px}.side{position:sticky;top:86px}}
.side-card{padding:18px;display:flex;flex-direction:column;gap:16px}
.side-head{display:flex;align-items:center;gap:14px}
.side-name{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.1}
.rank-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px;font-size:14px}
.rank-name{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--kid-l)}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.bar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--kid),var(--gold));box-shadow:0 0 12px var(--kid-glow)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px 12px 10px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.stat-v{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1}
.stat-v small{font-size:15px;color:var(--ink-2);font-weight:500}
.stat-l{font-size:13px;color:var(--ink-2);margin-top:5px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:12px;height:12px;border-radius:50%;display:inline-block}
.lg.today{background:var(--kid);box-shadow:0 0 8px var(--kid)}
.lg.done{background:var(--gold)}
.lg.late{border:2px dashed var(--late)}
.lg.lock{background:#3A4470}
.cta-box .btn{width:100%}

.st.is-today .planet::after{inset:-17px;border:2px dashed var(--kid);opacity:.6;animation:spin 14s linear infinite}

.st.late .planet::after,.st.verylate .planet::after{inset:-12px;border:2px dashed var(--late);animation:spin 16s linear infinite}
.st.done .planet{box-shadow:inset -10px -12px 20px rgba(0,0,0,.35),inset 6px 6px 14px rgba(255,255,255,.22),0 0 0 4px var(--gold),0 0 30px rgba(255,200,60,.5)}
.st.progress .planet::after{inset:-10px;background:conic-gradient(var(--gold) var(--pr),rgba(255,255,255,.12) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:none;border:0}
.st.just .planet{animation:pop .7s ease both}

.launch{position:absolute;left:50%;transform:translateX(-50%);width:220px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2}

var svgCache = new Map();

    var root = doc.documentElement;
    if (root && root.nodeName.toLowerCase() === 'svg' && !doc.getElementsByTagName('parsererror').length){

var chains = new Map();

function dbSetRetry(path, data){

function delChallenge(id){

  function fail(e){ clearTimeout(timer); S.dbError = e || {code:'unavailable'}; S.loaded.config = true; onData(true); }
  db.doc('config/app').onSnapshot(function(snap){ S.config = snap.exists ? snap.data() : null; S.loaded.config = true; settle(snap); onData(); }, fail);
  db.collection('profiles').onSnapshot(function(qs){ var o = {}; qs.docs.forEach(function(d){ o[d.id] = d.data(); }); S.profiles = o; S.loaded.profiles = true; onData(); }, fail);

function cleanQ(q){

function saveEditor(){

/* ----- import / export ----- */
function validateRaw(c){
  var errs = [];
  if (!c || typeof c !== 'object') return ['not a mission'];
  if (!/^\d{4}-\d{2}-\d{2}$/.test(c.date || '')) errs.push('date must look like 2026-11-08');
  var ids = kidsList().map(function(k){ return k.id; });
  if (!(c.kid === 'both' || ids.indexOf(c.kid) >= 0)) errs.push('kid must be ' + ids.join(', ') + ' or both');
  if (!Array.isArray(c.questions) || !c.questions.length) errs.push('no questions');
  else c.questions.forEach(function(q, i){ if (!normQuestion(q)) errs.push('question ' + (i + 1) + ' is incomplete'); });
  if (c.subject && !SUBJECTS[c.subject]) errs.push('unknown subject “' + c.subject + '”');
  if (c.lang && LANGS.indexOf(c.lang) < 0) errs.push('lang must be he, ar or en');
  return errs;
}
function parseImport(text){
  var data; try { data = JSON.parse(text); } catch(e){ return {error:'This isn’t valid JSON: ' + e.message}; }
  var arr = Array.isArray(data) ? data : (data && Array.isArray(data.challenges)) ? data.challenges : (data && data.date) ? [data] : null;
  if (!arr) return {error:'Expected {"challenges": [ … ]} or a list of missions.'};
  var rows = [];
  arr.forEach(function(c){
    var errs = validateRaw(c), kids = c && c.kid === 'both' ? kidsList().map(function(k){ return k.id; }) : [c && c.kid];
    kids.forEach(function(k){ var id = (c && c.date) + '_' + k; rows.push({c:c, kid:k, id:id, errs:errs, exists:S.challenges.has(id)}); });
  });
  return {rows:rows};
}

function saveSettings(){

    if (!name) errors.push('A name is empty.');

    if (codes[code]) errors.push('Each child needs a different code.'); codes[code] = 1;

  if (errors.length){ S.admin.settingsErrors = errors; render(false); window.scrollTo(0, 0); return; }

}

function startSky(){
  var c = $('#sky'), ctx = c.getContext('2d'); if (!ctx) return;
  var w = 0, h = 0, stars = [], shoot = null, nextShoot = 0, last = 0, running = false;
  function resize(){
    var d = Math.min(2, window.devicePixelRatio || 1); w = c.clientWidth; h = c.clientHeight; c.width = w * d; c.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    var count = Math.round(Math.min(240, w * h / 5600));
    stars = []; for (var i = 0; i < count; i++) stars.push({x:Math.random() * w, y:Math.random() * h, r:Math.random() * 1.3 + .3, z:Math.random() * .8 + .2, t:Math.random() * 6.28, s:.4 + Math.random() * 1.4, c:Math.random() < .14 ? '#FFE6A8' : (Math.random() < .2 ? '#BFE7FF' : '#FFFFFF')});
    if (reduceMotion) draw(0);
  }
  function draw(dt){
    ctx.clearRect(0, 0, w, h);
    var sy = window.scrollY || 0;
    for (var i = 0; i < stars.length; i++){
      var s = stars[i]; s.t += dt * .001 * s.s;
      var a = .35 + .65 * (.5 + .5 * Math.sin(s.t));
      var y = ((s.y - sy * .06 * s.z) % h + h) % h;
      ctx.globalAlpha = a; ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, y, s.r * (.7 + s.z * .5), 0, 6.283); ctx.fill();
    }
    if (!reduceMotion){
      var now = performance.now();
      if (!shoot && now > nextShoot){ shoot = {x:Math.random() * w * .8 + w * .1, y:Math.random() * h * .4, vx:-(5 + Math.random() * 4), vy:2.4 + Math.random() * 2, life:1}; nextShoot = now + 5000 + Math.random() * 7000; }
      if (shoot){
        shoot.x += shoot.vx * dt / 16; shoot.y += shoot.vy * dt / 16; shoot.life -= dt / 900;
        var g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 14, shoot.y - shoot.vy * 14);
        g.addColorStop(0, 'rgba(255,255,255,' + Math.max(0, shoot.life) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');

function tick(){
