<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בירות בלתי אפשריות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE  playful but hushed, like a pocket puzzle game for kids and parents
   IDEA   a travel passport: each capital is a stamped visa page, the levels are impossible monuments
   PICTURE the live isometric monument fills the screen; passport cover and stamps frame it
   COLOUR passport navy + gold for the housing; every level brings its own city palette
   TYPE   Heebo (Hebrew) + Tajawal (Arabic), heavy display weights, sentence case
   LAYOUT phone: slim navy bar on top, monument below, tip pill at the bottom; overlays are single cards */
:root{color-scheme:light;--navy:#14213d;--navy2:#1f3160;--gold:#e9c46a;--gold2:#b8862b;--paper:#f3f6ef;--ink:#17203b;--lvl:#14213d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--navy);color:var(--ink);font:16px/1.5 'Heebo','Tajawal',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:6px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));background:var(--navy);color:#fff;z-index:2}
#ttl{flex:1;display:flex;flex-direction:column;line-height:1.15;padding-inline:4px}
#tNum{font-size:13px;font-weight:600;color:var(--gold);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tName{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid rgba(233,196,106,.35);background:rgba(255,255,255,.06);display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.94)}
.ib:focus-visible,.opt:focus-visible,.btn:focus-visible,.slot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#bSnd.off .w{display:none}#bSnd:not(.off) .x{display:none}
#stage{position:relative;flex:1;min-height:0;touch-action:manipulation}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#tip{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,12px);max-width:min(92%,520px);width:max-content;padding:10px 16px;border-radius:999px;background:rgba(20,33,61,.92);color:#fff;font-size:15px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#tip.on{opacity:1;transform:translate(-50%,0)}
#tScore{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left));margin:0;z-index:2;padding:6px 12px;border-radius:999px;background:rgba(20,33,61,.86);color:var(--gold);font-size:14px;font-weight:800;line-height:1.1;white-space:nowrap;pointer-events:none}
#tScore.low{color:#fff;box-shadow:inset 0 0 0 1.5px var(--gold)}
#hintBox{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94%,460px);z-index:3;display:grid;gap:10px;padding:14px 16px 12px;border-radius:18px;background:rgba(20,33,61,.97);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35);border:1px solid rgba(233,196,106,.35)}
#hintBox[hidden]{display:none}
.hbtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
#hbTitle{font-size:18px;font-weight:800;color:var(--gold)}
#hbScore{font-size:14px;font-weight:700;color:#dfe5f3;white-space:nowrap}
#hbText{margin:0;font-size:16px;line-height:1.45}
.hbrow{display:flex;gap:8px;flex-wrap:wrap}
#hbStep{flex:1 1 200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:8px 14px;line-height:1.2}
#hbStep small{font-size:13px;font-weight:700;opacity:.8}
#hbClose{flex:0 1 auto}
#hbNote{margin:0;font-size:13px;color:#b9c3dc}
.qscore{margin:0 0 4px;font-size:14px;font-weight:800;color:#56607d}
.qscore.top{color:#a8741a}
.qaward{margin:0 0 6px;font-size:15px;font-weight:800;color:#56607d}
.qaward:empty{display:none}
.qaward.got{color:#1e7a46}
.tdcbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tdcbar[hidden]{display:none}
#hExit{min-height:42px;padding:6px 16px;font-size:15px}
.tdcpill{font-size:14px;font-weight:800;color:var(--navy);background:var(--gold);border-radius:999px;padding:6px 12px;white-space:nowrap}
.tdcpill[hidden]{display:none}
#hbBonus{margin:0;font-size:14px;font-weight:700;color:var(--gold)}
#hbBonus[hidden]{display:none}
.ov{position:fixed;inset:0;z-index:5;display:none;overflow:auto}
.ov.show{display:block}
/* passport cover */
#home{background:radial-gradient(120% 80% at 50% 0%,var(--navy2),var(--navy) 60%);color:#fff;padding:max(18px,env(safe-area-inset-top)) 16px 24px}
.cover{max-width:760px;margin:0 auto;display:grid;gap:14px}
.crest{display:flex;align-items:center;gap:14px}
.crest svg{width:74px;height:74px;flex:none;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linejoin:round}
#hKicker{margin:0;color:var(--gold);font-size:14px;font-weight:600}
#hTitle{margin:2px 0 0;font-size:clamp(32px,8vw,48px);line-height:1.05;font-weight:800;color:var(--gold);letter-spacing:-.01em;text-wrap:balance}
#hSub{margin:0;font-size:16px;color:#dfe5f3;max-width:60ch}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:48px;padding:10px 22px;border-radius:14px;border:0;font-weight:800;font-size:17px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.line{background:transparent;color:var(--gold);border:1.5px solid rgba(233,196,106,.6)}
.page{background:var(--paper);color:var(--ink);border-radius:18px;padding:14px;background-image:repeating-radial-gradient(circle at 20% 30%,rgba(20,90,110,.05) 0 2px,transparent 2px 9px),repeating-linear-gradient(115deg,rgba(184,134,43,.06) 0 1px,transparent 1px 12px)}
#stamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:600px){#stamps{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}#stamps .slot{min-height:78px;grid-template-columns:1fr;grid-template-rows:auto auto auto;row-gap:2px;padding:8px 6px;text-align:center;justify-items:center}#stamps .slot .flag{grid-row:auto;font-size:26px}#stamps .slot .nm{font-size:14px;overflow-wrap:normal;word-break:keep-all}#stamps .slot .no{font-size:12px}}
.slot{position:relative;min-height:84px;border-radius:14px;border:2px dashed rgba(23,32,59,.28);background:rgba(255,255,255,.55);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:8px;padding:10px 12px;text-align:start}
.slot .flag{grid-row:1/3;font-size:30px;line-height:1}
.slot .no{font-size:13px;font-weight:600;color:#5a6481}
.slot .nm{font-size:17px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.slot.done{border:2.5px solid var(--sc);color:var(--sc);transform:rotate(var(--rot));background:rgba(255,255,255,.75)}
.slot.done .no{color:var(--sc)}
.slot.locked{opacity:.45;cursor:default}
.slot:not(.locked):active{transform:scale(.97)}
/* quiz card */
#quiz{background:rgba(12,18,38,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
#quiz.show{display:grid;place-items:center}
.card{position:relative;width:min(520px,100%);background:var(--paper);border-radius:20px;padding:0 18px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;background-image:repeating-radial-gradient(circle at 80% 90%,rgba(20,90,110,.05) 0 2px,transparent 2px 9px)}
.qtop{display:flex;align-items:center;gap:14px;margin:0 -18px 16px;padding:16px 18px;background:var(--navy);color:#fff}
.qflag{font-size:44px;line-height:1;flex:none}
#qHead{margin:0;font-size:14px;font-weight:600;color:var(--gold)}
#qText{margin:2px 0 0;font-size:clamp(24px,6.2vw,32px);line-height:1.1;font-weight:800;text-wrap:balance}
#qOpts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:56px;border-radius:14px;border:2px solid rgba(20,33,61,.16);background:#fff;font-size:18px;font-weight:800;color:var(--navy);padding:8px}
.opt:not(:disabled):active{transform:scale(.97)}
.opt.no{opacity:.45;text-decoration:line-through;animation:shk .35s}
.opt.yes{background:#1e8a5a;border-color:#1e8a5a;color:#fff}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:24px;margin:12px 0 0;font-weight:600;font-size:16px}
.fb.bad{color:#b23a2b}.fb.good{color:#1e8a5a}
.qres{display:flex;align-items:center;gap:14px;margin-top:6px}
.qres[hidden]{display:none}
#qFact{margin:0;font-size:16px;line-height:1.55;color:#2b3350}
#qNext{margin-top:16px;width:100%}
.stamp{flex:none;width:118px;padding:8px 6px;border:3px solid var(--sc);border-radius:12px;color:var(--sc);text-align:center;transform:rotate(-10deg) scale(2);opacity:0;outline:1.5px solid var(--sc);outline-offset:3px;background:rgba(255,255,255,.5)}
.stamp b{display:block;font-size:20px;line-height:1.1;font-weight:800;overflow-wrap:anywhere}
.stamp small{display:block;font-size:13px;font-weight:600}
.stamp.in{animation:thump .45s cubic-bezier(.2,1.4,.4,1) forwards}
.stamp.gold{background:linear-gradient(135deg,#fff7d6,#f6dc8a);box-shadow:0 0 0 3px rgba(233,196,106,.45)}
.par{margin:0 0 4px;font-size:14px;font-weight:700;color:#56607d}
.par.gold{color:#a8741a}
.slot.gold{background:linear-gradient(135deg,#fffaf0,#fbeec6)}
.bonusH{grid-column:1/-1;margin:10px 2px 0;font-size:14px;font-weight:800;letter-spacing:.02em;color:#17203b;display:flex;align-items:center;gap:10px}
.bonusH::before,.bonusH::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.slot.bonus:not(.done){border-color:rgba(23,32,59,.45);background:rgba(23,32,59,.07)}
.slot.bonus .no::after{content:' ✦';color:var(--gold)}
#fly{background:#060b1f;padding:0;overflow:hidden}
#fly.show{display:block}
#flyCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.flytop{position:absolute;top:max(20px,env(safe-area-inset-top));left:12px;right:12px;text-align:center;color:#fff;pointer-events:none}
#flyFrom{margin:0;font-size:15px;font-weight:600;color:#c9d3ea}
#flyTo{margin:4px 0 0;font-size:clamp(24px,6.4vw,34px);font-weight:800;color:#ffd66e;line-height:1.15;text-wrap:balance}
.flyskip{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);min-width:170px;background:rgba(6,11,31,.55)}
/* language switch + unlock code */
.langs{display:flex;border:1.5px solid rgba(233,196,106,.6);border-radius:14px;overflow:hidden}
.langs button{min-height:45px;padding:8px 13px;border:0;background:transparent;color:var(--gold);font-weight:800;font-size:15px}
.langs button+button{border-inline-start:1px solid rgba(233,196,106,.35)}
.langs button.on{background:var(--gold);color:var(--navy)}
.langs button[lang=ar]{font-family:'Tajawal','Heebo',sans-serif}
.btn.line.code{padding:10px 16px;font-size:15px}
.btn.line.code.on{border-style:dashed}
.codebox{background:rgba(255,255,255,.06);border:1px solid rgba(233,196,106,.3);border-radius:14px;padding:12px 14px;display:grid;gap:8px;max-width:420px}
.codebox[hidden]{display:none}
.codebox label{font-size:15px;color:#dfe5f3;font-weight:600}
.crow{display:flex;gap:8px}
#cIn{width:8.5ch;min-height:48px;border-radius:12px;border:1.5px solid rgba(233,196,106,.6);background:#0f1a33;color:#fff;font:800 22px/1 'Heebo',system-ui,sans-serif;letter-spacing:.3em;text-align:center;padding:6px 8px}
#cIn:focus{outline:3px solid var(--gold);outline-offset:1px}
.cfb{margin:0;min-height:20px;font-size:15px;font-weight:700}.cfb.good{color:#7ee2b0}.cfb.bad{color:#ffb4a8}
.slot.chal:not(.done){border-color:rgba(91,56,140,.55);background:rgba(91,56,140,.08)}
.slot.chal .no::after{content:' ◆';color:#8e63c9}
.slot.geo:not(.done){border-color:rgba(31,122,110,.55);background:rgba(31,122,110,.08)}
.slot.geo .no::after{content:' ▲';color:#1f8a7a}
/* puzzle card */
#pz{background:rgba(12,18,38,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:14px}
#pz.show{display:grid;place-items:center}
.pzcard{padding-bottom:16px}
.pzseal svg{width:44px;height:44px;fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linecap:round}
.pzseal .f{fill:var(--gold);stroke:none}
#pzHead{margin:0;font-size:13.5px;font-weight:600;color:var(--gold);line-height:1.35}
#pzTitle{margin:2px 0 0;font-size:clamp(22px,6vw,28px);line-height:1.1;font-weight:800}
.pzintro{margin:0 0 12px;font-size:16px;line-height:1.5;color:#2b3350}
.pzwhy{margin:6px 0 0;font-size:15.5px;line-height:1.5;color:#2b3350;background:rgba(30,138,90,.08);border-radius:12px;padding:10px 12px}
.pzwhy[hidden]{display:none}
.pzact{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.pzact .btn{flex:1}
.pzact [hidden]{display:none}
.btn.line.dk{color:var(--navy);border-color:rgba(20,33,61,.3)}
.pz-q{margin:0 0 12px;font-size:19px;font-weight:800;line-height:1.35;color:var(--navy)}
.pz-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pz-opts .opt{font-size:16.5px;min-height:52px}
.pz-count{margin:8px 0 0;text-align:center;font-size:14px;font-weight:700;color:#56607d}
/* symbol sums */
.pz-sym{display:grid;gap:8px;margin-bottom:12px}
.pz-eq{display:flex;align-items:center;justify-content:center;gap:4px;direction:ltr;background:#fff;border-radius:12px;padding:6px 8px;border:1.5px solid rgba(20,33,61,.1)}
.pz-eq.ask{background:#fff7e0;border-color:rgba(184,134,43,.4)}
.pz-glyph{width:38px;height:38px;fill:none;stroke:#8a5a1c;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pz-glyph .f{fill:#8a5a1c;stroke:none}
.pz-op{font-size:22px;font-weight:800;color:#56607d;min-width:14px;text-align:center}
.pz-res{font-size:24px;font-weight:800;color:var(--navy);min-width:30px;text-align:center}
.pz-opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
/* magic square */
.pz-magic{display:grid;gap:12px;justify-items:center}
.pz-mgrid{display:grid;grid-template-columns:repeat(3,64px) 30px;grid-template-rows:repeat(3,64px) 26px;gap:6px;direction:ltr;align-items:center;justify-items:center}
.pz-sum{font-size:14px;font-weight:800;color:#8a93ad}
.pz-sum.ok{color:#1e8a5a}.pz-sum.over{color:#b23a2b}
.pz-diag{display:flex;gap:18px;justify-content:center;direction:ltr;margin-top:-4px}
.pz-dl{display:flex;align-items:center;gap:4px;font-size:14px}
.pz-dl b{color:#8a93ad;font-size:16px}
.pz-cell{width:64px;height:64px;border-radius:12px;border:2px solid rgba(20,33,61,.18);background:#fff;font-size:28px;font-weight:800;color:var(--navy)}
.pz-cell.given{background:#efe3c4;border-color:#c9a45a;color:#6b4a12;cursor:default}
.pz-cell.sel{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(233,196,106,.55)}
.pz-pad{display:grid;grid-template-columns:repeat(5,48px);gap:6px;direction:ltr}
.pz-key{height:46px;border-radius:12px;border:1.5px solid rgba(20,33,61,.18);background:#fff;font-size:20px;font-weight:800;color:var(--navy)}
.pz-key.used{background:#e9edf5;color:#9aa3bb}
.pz-key.del{font-size:18px}
/* lanterns */
.pz-lgrid{display:grid;gap:8px;max-width:290px;margin:0 auto}
.pz-lamp{aspect-ratio:1;border-radius:14px;border:0;background:#1d2747;display:grid;place-items:center;transition:background .25s}
.pz-lamp i{width:46%;height:58%;border-radius:40% 40% 46% 46%;background:#38446b;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:background .25s,box-shadow .25s}
.pz-lamp.on{background:#3a2a17}
.pz-lamp.on i{background:radial-gradient(circle at 50% 40%,#fff6c9,#f6c34a 55%,#d9801f);box-shadow:0 0 18px 6px rgba(246,195,74,.55)}
/* knight */
.pz-board{display:grid;max-width:300px;margin:0 auto;border-radius:12px;overflow:hidden;border:3px solid #6b4a12}
.pz-sq{aspect-ratio:1;border:0;background:#f3e2bd;display:grid;place-items:center;position:relative;padding:0}
.pz-sq.dk{background:#d9b77a}
.pz-sq.can::after{content:'';width:26%;height:26%;border-radius:50%;background:rgba(30,138,90,.75)}
.pz-sq.rock{background:#7b6a5c}
.pz-rock{width:62%;height:56%;border-radius:45% 50% 40% 42%;background:linear-gradient(#a89584,#5f5045)}
.pz-kn{font-style:normal;font-size:30px;line-height:1;color:#17203b;text-shadow:0 1px 0 #fff}
.pz-gem{width:42%;height:42%;background:linear-gradient(135deg,#9ff0ff,#2fa8d8 60%,#1b6f9c);transform:rotate(45deg);border-radius:4px;box-shadow:0 0 8px rgba(47,168,216,.6)}
/* sliding stones */
.pz-tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:250px;margin:0 auto;background:#c8b48f;padding:6px;border-radius:14px}
.pz-tile{aspect-ratio:1;border-radius:10px;border:0;background:linear-gradient(160deg,#fff7e6,#e6cf9f);font-size:30px;font-weight:800;color:#6b4a12;box-shadow:inset 0 -4px 0 rgba(107,74,18,.25)}
.pz-tile.home{color:#1e8a5a}
.pz-tile.gap{background:rgba(0,0,0,.08);box-shadow:none}
/* code lock */
.pz-clues{display:grid;gap:7px}
.pz-clue{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:7px 10px;border:1.5px solid rgba(20,33,61,.1)}
.pz-clue p{margin:0;font-size:14.5px;line-height:1.3;font-weight:600;color:#2b3350}
.pz-digits{display:flex;gap:4px;direction:ltr;flex:none}
.pz-d{width:28px;height:34px;border-radius:7px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:19px}
.pz-lock{display:flex;justify-content:center;gap:10px;margin:14px 0 10px;direction:ltr}
.pz-lock.shk{animation:shk .35s}
.pz-lock.ok .pz-num{background:#1e8a5a;color:#fff}
.pz-wheel{display:grid;gap:4px;justify-items:center}
.pz-up,.pz-dn{width:52px;height:38px;border-radius:10px;border:1.5px solid rgba(20,33,61,.2);background:#fff;font-size:15px;color:var(--navy)}
.pz-num{width:52px;height:56px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:32px;font-weight:800}
.pz-open{width:100%}
/* canals */
.pz-psvg{width:100%;max-width:360px;display:block;margin:0 auto;touch-action:manipulation}
.pz-pc{cursor:pointer}
.pz-pc .bg{fill:#e9dcc0;stroke:#c9b48a;stroke-width:1.5}
.pz-pc .pipe{stroke:#9b8a72;stroke-width:11;stroke-linecap:round;fill:none}
.pz-pc .joint{fill:#9b8a72}
.pz-pc.wet .pipe{stroke:#2f9ad0}.pz-pc.wet .joint{fill:#2f9ad0}
.pz-end .wtr{fill:#2f9ad0}.pz-end .lk{fill:#b9c7cf}.pz-end.full .lk{fill:#2f9ad0}
.pz-legend{display:flex;justify-content:space-between;max-width:360px;margin:4px auto 0;font-size:13px;font-weight:700;color:#56607d;direction:ltr}
/* sun stone */
.pz-dsvg{width:100%;max-width:280px;display:block;margin:0 auto;touch-action:manipulation}
.pz-ring{cursor:pointer}
.pz-ring .band{fill:none;stroke-width:24;stroke-opacity:.28}

<script>
/* Impossible Capitals — isometric puzzle engine (pure logic, no DOM).
   World: x = down-right, y = down-left, z = up. Cube cell (x,y,z).
   Screen lattice: a = X - Z, b = Y - Z ; sx = (a-b)*S , sy = (a+b)*S/2.
   Rule of the game: if two walkable surfaces LOOK connected on screen, they ARE connected.
   Mechanisms: rotating groups (x/y/z), two-stop sliders, levers (global or local: usable only from a pad),
   links (one lever moves several structures), one-shot plates and toggle plates. */
var ICE = (function () {
  'use strict';
  var K = function (x, y, z) { return x + ',' + y + ',' + z; };

  function rotQ(v, axis, q) {
    q = ((q % 4) + 4) % 4;
    var x = v[0], y = v[1], z = v[2], t;
    for (var i = 0; i < q; i++) {
      if (axis === 'z') { t = x; x = -y; y = t; }
      else if (axis === 'x') { t = y; y = -z; z = t; }
      else { t = x; x = z; z = -t; }
    }
    return [x, y, z];
  }
  function rotA(v, axis, ang) {
    var c = Math.cos(ang), s = Math.sin(ang), x = v[0], y = v[1], z = v[2];
    if (axis === 'z') return [x * c - y * s, x * s + y * c, z];
    if (axis === 'x') return [x, y * c - z * s, y * s + z * c];
    return [x * c + z * s, y, -x * s + z * c];
  }

  // decorations that occupy the cell above their block (block top becomes non-walkable)
  var TALL = { dome: 1, drum: 1, spire: 1, pyr: 1, pagoda: 1, pagoda5: 1, eiffel: 1, tree: 1, flag: 1, mast: 1, obelisk: 1, bowl: 1, cap: 1, battle: 1, torii: 1, minaret: 1, twin: 1, lantern: 1, beehive: 1, turtle: 1, hanoi: 1, heaven: 1, tvtower: 1, petronas: 1, bayterek: 1, cone: 1, sphere: 1, glasspyr: 1, gable: 1, tent: 1, pencil: 1 };

  function same(c, d) { return c[0] === d[0] && c[1] === d[1] && c[2] === d[2]; }

  function compile(def) {
    var L = { def: def, items: [], groups: [], plates: [], start: -1, goal: -1 };
    var gi = {};
    (def.groups || []).forEach(function (g, i) {
      gi[g.id] = i;
      L.groups.push({ id: g.id, i: i, type: g.type, axis: g.axis, pivot: g.pivot, dir: g.dir || 1, stops: g.stops || [0, 1], init: g.init || 0, swing: g.swing, handle: g.handle, link: g.link, color: g.color });
    });
    def.items.forEach(function (it, i) {
      var o = {};
      for (var k in it) o[k] = it[k];
      o.i = i;
      o.g = (it.g == null) ? -1 : gi[it.g];
      if (o.g === undefined) throw new Error('unknown group ' + it.g);
      if (o.kind === 'stair' && o.g >= 0 && L.groups[o.g].type === 'rot') throw new Error('stairs cannot rotate');
      if (o.start) L.start = i;
      if (o.goal) L.goal = i;
      if (o.plate) {
        o.plate = o.plate.map(function (a) { if (gi[a.g] == null) throw new Error('plate group ' + a.g); return { g: gi[a.g], to: a.to }; });
        if (!o.toggle) L.plates.push(i);
      }
      L.items.push(o);
    });
    function find(c, pref) {
      var best = -1;
      L.items.forEach(function (it) { if (same(it.cell, c) && (best < 0 || it.g === pref)) best = it.i; });
      return best;
    }
    L.groups.forEach(function (G) {
      if (G.type === 'rot') {
        var p2 = G.pivot.map(function (v) { return Math.round(v * 2); });
        G.p2 = p2;
        var perp = G.axis === 'z' ? [0, 1] : G.axis === 'x' ? [1, 2] : [0, 2];
        if ((p2[perp[0]] & 1) !== (p2[perp[1]] & 1)) throw new Error('bad pivot for ' + G.id);
      }
      G.handles = [];
      (Array.isArray(G.handle) ? G.handle : G.handle ? [G.handle] : []).forEach(function (h, hi) {
        var at = h.at;
        var idx = L.items.findIndex(function (it) { return same(it.cell, at) && (h.remote ? it.g === -1 : it.g === G.i); });
        if (idx < 0) throw new Error('handle item missing for ' + G.id);
        var H = { gi: G.i, hi: hi, item: idx, face: h.face || 'top', from: null };
        if (h.from) {
          H.from = h.from.map(function (c) { var j = find(c, G.i); if (j < 0) throw new Error('lever pad missing for ' + G.id + ' at ' + c); return j; });
          H.from.forEach(function (j) { L.items[j].pad = (L.items[j].pad || []).concat([G.i]); });
        }
        G.handles.push(H);
        (L.items[idx].handles = L.items[idx].handles || []).push(H);
      });
      G.global = G.handles.some(function (H) { return !H.from; });
      G.pads = [].concat.apply([], G.handles.map(function (H) { return H.from || []; }));
      if (G.handles.length) { G.hItem = G.handles[0].item; G.hFace = G.handles[0].face; }
      if (G.swing && G.swing.indexOf(G.init) < 0) throw new Error('swing init for ' + G.id);
      if (G.link) G.link = G.link.map(function (l) { if (gi[l.g] == null) throw new Error('link ' + l.g); return { g: gi[l.g], dir: l.dir || 1 }; });
    });
    L.plates.forEach(function (pi, n) { L.items[pi].plateBit = 1 << n; });
    if (L.start < 0 || L.goal < 0) throw new Error('start/goal missing');
    return L;
  }

  function initState(L) { return L.groups.map(function (g) { return g.init; }); }

  function cellOf(L, it, st) {
    if (it.g < 0) return it.cell;
    var G = L.groups[it.g], s = st[it.g], c = it.cell;
    if (G.type === 'rot') {
      var p2 = G.p2, d = [2 * c[0] + 1 - p2[0], 2 * c[1] + 1 - p2[1], 2 * c[2] + 1 - p2[2]];
      var r = rotQ(d, G.axis, s);
      return [(p2[0] + r[0] - 1) / 2, (p2[1] + r[1] - 1) / 2, (p2[2] + r[2] - 1) / 2];
    }
    var o = G.stops[s];
    return [c[0] + (G.axis === 'x' ? o : 0), c[1] + (G.axis === 'y' ? o : 0), c[2] + (G.axis === 'z' ? o : 0)];
  }

  function layout(L, st) {
    var cells = new Map(), placed = [], clash = false;
    L.items.forEach(function (it) {
      var c = cellOf(L, it, st);
      placed[it.i] = c;
      var k = K(c[0], c[1], c[2]);
      if (cells.has(k)) clash = true; else cells.set(k, it.i);
      if (it.deco && TALL[it.deco]) {
        var k2 = K(c[0], c[1], c[2] + 1);
        if (cells.has(k2)) clash = true; else cells.set(k2, -1 - it.i);
      }
    });
    return { placed: placed, cells: cells, clash: clash };
  }

  // triangles of the screen lattice: R(i,j) = {(i,j),(i+1,j),(i+1,j+1)}, L(i,j) = {(i,j),(i,j+1),(i+1,j+1)}
  function T(t, i, j) { return t + i + ',' + j; }
  function cubeTris(a, b) { return [T('R', a - 1, b - 1), T('L', a - 1, b - 1), T('L', a, b - 1), T('R', a, b), T('L', a, b), T('R', a - 1, b)]; }
  function stairTris(a, b, dir) {
    return dir === '-x' ? [T('L', a - 1, b - 1), T('R', a - 1, b), T('L', a, b), T('R', a, b)]
      : [T('R', a - 1, b - 1), T('L', a, b - 1), T('R', a, b), T('L', a, b)];
  }
  function P(a, b) { return a + ',' + b; }
  function E(p, q) { return (p[0] < q[0] || (p[0] === q[0] && p[1] < q[1])) ? P(p[0], p[1]) + '|' + P(q[0], q[1]) : P(q[0], q[1]) + '|' + P(p[0], p[1]); }

  // only path-styled surfaces (and stairs) can be walked on
  function walkable(it) { return (it.style === 'path' || it.kind === 'stair' || it.walk) && !it.nowalk && !(it.deco && TALL[it.deco]); }

  // Build visibility + walk graph for a resting state.
  function graph(L, st) {
    var lay = layout(L, st), own = new Map();
    function reg(t, d, o) { var e = own.get(t); if (!e || d > e[0]) own.set(t, [d, o]); }
    L.items.forEach(function (it) {
      var c = lay.placed[it.i], a = c[0] - c[2], b = c[1] - c[2], d = c[0] + c[1] + c[2];
      var tris = it.kind === 'stair' ? stairTris(a, b, it.dir) : cubeTris(a, b);
      tris.forEach(function (t) { reg(t, d, it.i); });
    });
    var nodes = new Map(), byItem = {}, emap = new Map();
    function addEdge(e, id) { var l = emap.get(e); if (!l) { l = []; emap.set(e, l); } l.push(id); }
    L.items.forEach(function (it) {
      if (!walkable(it)) return;
      var c = lay.placed[it.i], a = c[0] - c[2], b = c[1] - c[2];
      var n;
      if (it.kind === 'stair') {
        var ok = stairTris(a, b, it.dir).every(function (t) { var e = own.get(t); return e && e[1] === it.i; });
        if (!ok) return;
        n = { id: 'S' + it.i, item: it.i, kind: 'stair', a: a, b: b, ca: a, cb: b, depth: c[0] + c[1] + c[2] };
        var low = it.dir === '-x' ? [[a + 1, b], [a + 1, b + 1]] : [[a, b + 1], [a + 1, b + 1]];
        var high = it.dir === '-x' ? [[a - 1, b - 1], [a - 1, b]] : [[a - 1, b - 1], [a, b - 1]];
        n.ports = [E(low[0], low[1]), E(high[0], high[1])];
      } else {
        var t1 = own.get(T('R', a - 1, b - 1)), t2 = own.get(T('L', a - 1, b - 1));
        if (!t1 || !t2 || t1[1] !== it.i || t2[1] !== it.i) return;
        n = { id: 'T' + a + ',' + b, item: it.i, kind: 'top', a: a, b: b, ca: a - 0.5, cb: b - 0.5, depth: c[0] + c[1] + c[2] };
        n.ports = [E([a - 1, b - 1], [a, b - 1]), E([a, b - 1], [a, b]), E([a, b], [a - 1, b]), E([a - 1, b], [a - 1, b - 1])];
      }
      n.adj = [];
      nodes.set(n.id, n);
      byItem[it.i] = n.id;
      n.ports.forEach(function (e) { addEdge(e, n.id); });
    });
    emap.forEach(function (ids, e) {
      if (ids.length < 2) return;
      var pa = e.split('|').map(function (s) { return s.split(',').map(Number); });
      var ma = (pa[0][0] + pa[1][0]) / 2, mb = (pa[0][1] + pa[1][1]) / 2;
      for (var i = 0; i < ids.length; i++) for (var j = 0; j < ids.length; j++) if (i !== j) nodes.get(ids[i]).adj.push({ to: ids[j], ma: ma, mb: mb });
    });
    return { nodes: nodes, byItem: byItem, lay: lay, own: own };
  }

  function path(G, from, to, stop) {
    if (from === to) return [from];
    var prev = {}, q = [from], seen = {}; seen[from] = 1;
    while (q.length) {
      var u = q.shift();
      if (u !== from && stop && stop(u)) continue;
      var n = G.nodes.get(u);
      for (var i = 0; i < n.adj.length; i++) {
        var v = n.adj[i].to;
        if (seen[v]) continue;
        seen[v] = 1; prev[v] = u;
        if (v === to) {

    $('#tdcBar').hidden = !TDC;
    if (TDC) { $('#hExit').textContent = tx.tdcBack; $('#hBonus').textContent = TDC.preview ? tx.tdcPreview : tx.tdcMonth(fmtN(TDC.month)); $('#hBonus').hidden = !(TDC.max > 0 || TDC.preview); }
    var all = LV.every(function (_, i) { return P.done[i]; });
    $('#hSub').textContent = all ? tx.endS : tx.sub;
    var nDone = LV.filter(function (_, i) { return P.done[i]; }).length, nGold = LV.filter(function (_, i) { return P.done[i] === 2; }).length;
    var tot = 0; LV.forEach(function (_, i) { if (P.done[i]) tot += P.score && P.score[i] != null ? P.score[i] : 100; });
    $('#hKicker').textContent = (all ? tx.endT + ' · ' : tx.passport + ' · ') + nDone + '/' + LV.length + ' ' + tx.stamps + (nGold ? ' · ' + nGold + ' ' + tx.perfects : '') + (nDone ? ' · ' + tot + ' ' + tx.pts(tot) : '');
    [].forEach.call(document.querySelectorAll('#hLangs button'), function (b) { var on = b.dataset.l === P.lang; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    $('#hCode').textContent = P.all ? tx.codeOn : tx.code; $('#hCode').classList.toggle('on', !!P.all);
    $('#cLbl').textContent = tx.codeT; $('#cGo').textContent = tx.codeGo;
    var any = Object.keys(P.done).length > 0;
    $('#hGo').textContent = all ? tx.again : any ? tx.cont : tx.start;
    $('#bHome').setAttribute('aria-label', tx.home); $('#bHint').setAttribute('aria-label', tx.hint);
    $('#bReset').setAttribute('aria-label', tx.reset); $('#bSnd').setAttribute('aria-label', tx.sound);
    var grid = $('#stamps'); grid.innerHTML = '';
    LV.forEach(function (d, i) {
      var b = document.createElement('button'), ok = !!P.done[i], open = unlocked(i);
      var tier = d.meta.bonus || 0, prev = i > 0 ? (LV[i - 1].meta.bonus || 0) : 0;
      if (tier && tier !== prev) { var hh = document.createElement('div'); hh.className = 'bonusH'; hh.textContent = tier === 3 ? tx.geoH : tier === 2 ? tx.chalH : tx.bonusH; grid.appendChild(hh); }
      b.type = 'button'; b.className = 'slot' + (ok ? ' done' : '') + (P.done[i] === 2 ? ' gold' : '') + (open ? '' : ' locked') + (tier ? ' bonus' : '') + (tier === 2 ? ' chal' : '') + (tier === 3 ? ' geo' : '');
      b.style.setProperty('--sc', d.meta.stamp || '#c0392b');
      b.style.setProperty('--rot', (((i * 37) % 11) - 5) + 'deg');
      var f = document.createElement('span'); f.className = 'flag'; f.textContent = d.meta.flag;
      var n = document.createElement('span'); n.className = 'nm'; n.textContent = ok ? lv(i, 'options')[0] : lv(i, 'country');
      var k = document.createElement('span'); k.className = 'no'; k.textContent = open ? (i + 1) + (P.done[i] === 2 ? ' ★' : '') + (ok && P.score && P.score[i] != null ? ' · ' + P.score[i] : '') : tx.locked;
      b.appendChild(k); b.appendChild(f); b.appendChild(n);
      b.disabled = !open;
      b.addEventListener('click', function () { goLevel(i); });
      grid.appendChild(b);
    });
    if (G) { movesLabel(); titleName(); }
  }
  var homeOn = false;
  function show(id) {
    homeOn = id === 'home' || id === 'fly';
    ['home', 'quiz', 'pz', 'fly'].forEach(function (k) { $('#' + k).classList.toggle('show', k === id); });
    if (id === 'home') buildHome();
  }

  $('#hGo').addEventListener('click', function () {
    SND.init();
    if (LV.every(function (_, i) { return P.done[i]; })) { P.done = {}; P.score = {}; P.hu = {}; P.at = -1; save(); }
    goLevel(firstOpen());
  });
  $('#hLangs').addEventListener('click', function (e) { var b = e.target.closest('button[data-l]'); if (!b) return; P.lang = b.dataset.l; save(); buildHome(); });
  $('#hCode').addEventListener('click', function () { var bx = $('#codeBox'); bx.hidden = !bx.hidden; if (!bx.hidden) { $('#cIn').value = ''; $('#cFb').textContent = ''; $('#cFb').className = 'cfb'; try { $('#cIn').focus(); } catch (e) { } } });
  $('#codeBox').addEventListener('submit', function (e) {
    e.preventDefault(); SND.init();
    var v = ($('#cIn').value || '').replace(/\s/g, ''), tx = tr();
    if (v === '2804') { P.all = true; save(); buildHome(); $('#cFb').textContent = tx.codeOk; $('#cFb').className = 'cfb good'; SND.play('ok'); }
    else { $('#cFb').textContent = tx.codeBad; $('#cFb').className = 'cfb bad'; SND.play('bad'); try { $('#cIn').select(); } catch (e2) { } }
  });
  $('#bHome').addEventListener('click', function () { show('home'); });
  $('#hExit').addEventListener('click', function () { tdcPost({ type: 'exit' }); });
  $('#bReset').addEventListener('click', function () { if (G) start(G.i); });
  /* ---------- hints: the level's tip for free, and the next step for 10 points ---------- */
  function nextStep() {
    var r = ICE.solve(G.L, 3000000, { st: G.st, c: G.ch.item, p: G.pressed });
    if (!r.ok) return { none: true };
    var stand = G.node;
    for (var k = 0; k < r.steps.length; k++) {
      var sp = r.steps[k], c = sp.indexOf(':'), kind = sp.slice(0, c), id = sp.slice(c + 1);
      if (kind === 'walk') { stand = id; continue; }
      if (kind === 'plate') return id === G.node ? { plate: id, off: stand } : { plate: id };
      var gi = G.L.groups.findIndex(function (g) { return g.id === id; }), Gr = G.L.groups[gi];
      // the plan may wander before pulling a lever that works from anywhere: if pulling it right here is just as good, say so
      if (stand !== G.node && ICE.canPull(G.L, gi, G.ch.item)) {
        var o = ICE.operate(G.L, G.st, gi, G.ch.item);
        if (!o.err && !o.same) {
          var r2 = ICE.solve(G.L, 3000000, { st: o.st, c: G.ch.item, p: G.pressed });
          if (r2.ok && r2.ops + 1 <= r.ops) stand = G.node;
        }
      }
      var sn = stand != null && G.graph.nodes.get(stand), item = sn ? sn.item : G.ch.item, hi = -1;   // the traveller may stand on a hidden tile (no node)
      Gr.handles.forEach(function (H, h) { if (hi < 0 && H.from && H.from.indexOf(item) >= 0) hi = h; });
      Gr.handles.forEach(function (H, h) { if (hi < 0 && !H.from) hi = h; });
      return { gi: gi, hi: Math.max(0, hi), stand: stand, item: item };
    }
    return { goal: stand };
  }
  function busy() { return !!(G.seg || G.anims.length || (G.path && G.path.length)); }
  function showStep() {
    if (!G || G.won) return null;
    if (busy()) return 'busy';
    var t = tr(), s = nextStep(), mark = function (id) { var n = G.graph.nodes.get(id); return { a: n.ca + 0.5, b: n.cb + 0.5 }; };
    if (s.none) { G.hint = null; showTip(t.stepNone, 6); return s; }
    P.hu[G.i] = (P.hu[G.i] || 0) + 1; save(); movesLabel();
    if (s.off) { G.hint = Object.assign(mark(s.off), { item: G.graph.nodes.get(s.off).item, then: mark(s.plate) }); showTip(t.stepOff, 8); }
    else if (s.plate) { G.hint = mark(s.plate); showTip(t.stepPlate, 7); }
    else if (s.goal) { G.hint = mark(s.goal); showTip(t.stepGoal, 7); }
    else {
      var here = s.stand === G.node;
      G.hint = here ? { gi: s.gi, hi: s.hi } : Object.assign(mark(s.stand), { gi: s.gi, hi: s.hi, item: s.item });
      showTip((here ? t.stepOp : t.stepWalkOp) + (sealed(s.gi) ? t.stepSeal : ''), 8);
    }
    SND.play('plate');
    return s;
  }
  function openHint() {
    var t = tr(), bx = $('#hintBox');
    $('#hbTitle').textContent = t.hint;
    $('#hbText').textContent = lv(G.i, 'hint') || '';
    $('#hbScore').textContent = t.scoreL(levelScore(G.i));
    $('#hbNote').textContent = t.hintNote;
    $('#hbBonus').hidden = !(TDC && TDC.max > 0);
    if (TDC) $('#hbBonus').textContent = t.tdcHint(fmtN(bonusFor(levelScore(G.i))), fmtN(TDC.max));
    $('#hbStep').firstChild.textContent = t.stepBtn;
    $('#hbCost').textContent = t.stepCost; $('#hbCost').hidden = levelScore(G.i) === 0;
    $('#hbClose').textContent = t.close;
    bx.hidden = false; hideTip();
  }
  function closeHint() { var bx = $('#hintBox'); if (bx) bx.hidden = true; }
  $('#bHint').addEventListener('click', function () { if (!G) return; SND.init(); if ($('#hintBox').hidden) openHint(); else closeHint(); });
  $('#hbClose').addEventListener('click', closeHint);
  // the search can take a moment on the big levels: show a short note first, then think
  $('#hbStep').addEventListener('click', function () {
    closeHint(); showTip(tr().thinking, 4);
    var n = 0;
    requestAnimationFrame(function () { setTimeout(function go() { if (showStep() === 'busy' && n++ < 40) setTimeout(go, 120); }, 40); });
  });
  function sndIcon() { $('#bSnd').classList.toggle('off', !!P.mute); }
  $('#bSnd').addEventListener('click', function () { P.mute = !P.mute; save(); sndIcon(); SND.init(); });

  var down = null;
  cv.addEventListener('pointerdown', function (e) { var r = cv.getBoundingClientRect(); down = { x: e.clientX - r.left, y: e.clientY - r.top }; closeHint(); });
  cv.addEventListener('pointerup', function (e) {
    if (!down) return;
    var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (Math.hypot(x - down.x, y - down.y) < 14) tap(x, y);
    down = null;
  });
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) { var ro = new ResizeObserver(resize); ro.observe($('#stage')); }

  function boot(data) {
    loadP(data);
    applyDir();
    sndIcon();
    buildHome();
    start(Math.min(P.li || 0, LV.length - 1));
    if (!data || !data.inLevel) show('home');
    raf = requestAnimationFrame(frame);
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () { return { lang: P.lang, done: P.done, score: P.score, hu: P.hu, li: G ? G.i : 0, mute: P.mute, all: P.all, at: P.at, inLevel: !$('#home').classList.contains('show') }; });
  }
  window.__ic = { start: start, tap: tap, op: op, state: function () { return G; }, R: R, show: show, P: P, quiz: quiz, home: buildHome, SOLVED: SOLVED, pzSolve: function () { if (G && G.pz) G.pz.api.solved(); }, pzGo: function () { $('#pzGo').click(); }, goLevel: function (i) { goLevel(i); }, flying: function () { return !!flying; }, step: showStep, tryOp: function (gi, hi) { tryOp(gi, hi); }, score: function () { return G ? levelScore(G.i) : null; }, hu: function () { return P.hu; }, tdc: function () { return TDC; } };
  if (EMBED) {
    window.addEventListener('message', function (e) {
      var m = e.data;
      if (e.source !== window.parent || !m || m.src !== 'tdc') return;
      if (m.type === 'init' && !TDC) {
        TDC = { kid: String(m.kid || ''), max: Math.max(0, Number(m.max) || 0), month: Number(m.month) || 0, preview: !!m.preview };
        var st = m.state && typeof m.state === 'object' ? m.state : { lang: m.lang, mute: !!m.mute };
        boot(st);
      } else if (m.type === 'award') onAward(m);
    });
    tdcPost({ type: 'ready' });
  } else if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
}
